name: Inventario LiDAR experimental
on:
  push:
    branches: [experimental/inventario-forestal-lidar-0.4.4]
    paths:
      - 'qgis/inventario_forestal_lidar/**'
      - '.github/workflows/experimental-lidar.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: experimental-lidar-release
  cancel-in-progress: false
jobs:
  windows-storage:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        working-directory: qgis/inventario_forestal_lidar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Height cutoff command and export validation
        run: python -m unittest discover -s tests -p test_height_cutoff.py -v
      - name: Terrain subset command validation
        run: python -m unittest discover -s tests -p test_terrain_subset.py -v
      - name: Storage and LAS read error regressions
        run: python -m unittest discover -s tests -p test_storage.py -v
  test-package-release:
    needs: windows-storage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qgis/inventario_forestal_lidar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Portable tests (QGIS integration skipped here)
        run: python -m unittest discover -s tests -v
      - name: Build installable ZIP
        run: python tools/build.py dist
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="lidar-v0.4.4-experimental-${GITHUB_SHA:0:7}"
          gh release create "$tag" dist/inventario_forestal_lidar-0.4.4-experimental.zip dist/inventario_forestal_lidar-0.4.4-experimental.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Inventario forestal LiDAR 0.4.4 experimental" \
            --notes-file docs/RELEASE.md
