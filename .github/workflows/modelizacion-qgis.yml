name: Modelización QGIS experimental
on:
  push:
    branches: [experimental/modelizacion-qgis-0.2.0]
    paths: ['qgis/modelizacion_forestal_lidar/**', '.github/workflows/modelizacion-qgis.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      MPLCONFIGDIR: .matplotlib-cache
    defaults:
      run:
        working-directory: qgis/modelizacion_forestal_lidar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas matplotlib
      - run: python -m unittest discover -s tests -p test_engine.py -v
      - run: python -m unittest discover -s tests -p test_small_sample.py -v
  package:
    needs: portable
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qgis/modelizacion_forestal_lidar
    steps:
      - uses: actions/checkout@v4
      - run: python build.py
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="modelizacion-qgis-v0.2.0-experimental-${GITHUB_SHA:0:7}"
          gh release create "$tag" dist/modelizacion_forestal_lidar-0.2.0-experimental.zip dist/modelizacion_forestal_lidar-0.2.0-experimental.zip.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Modelización forestal LiDAR QGIS 0.2.0 experimental" --notes-file RELEASE.md
